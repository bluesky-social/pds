global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Host metrics are scraped. PDS metrics are *pushed* by the PDS over OTLP to
# /api/v1/otlp/v1/metrics (enabled by --web.enable-otlp-receiver in
# compose.yaml), so the PDS needs no scrape job here.
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

otlp:
  # Keep OTel resource attributes that identify which PDS a series came from.
  promote_resource_attributes:
    - service.name
    - service.version
    - service.instance.id
    - host.name

storage:
  tsdb:
    # OTLP is a push protocol, so samples can arrive slightly out of order.
    out_of_order_time_window: 30m
